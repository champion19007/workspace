services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workspace-v1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_dev_password
      POSTGRES_DB: workspace_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_user -d workspace_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
