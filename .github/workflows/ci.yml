name: Foundation CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  foundation-checks:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workspace_user
          POSTGRES_PASSWORD: workspace_dev_password
          POSTGRES_DB: workspace_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U workspace_user -d workspace_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Repository (Enforces Core Import Boundary)
        run: pnpm run lint

      - name: Verify Architectural Boundaries (Vitest AST Scan)
        run: pnpm run test:arch

      - name: Initialize Database (Extensions and Login Roles)
        run: psql -v ON_ERROR_STOP=1 -d "postgresql://workspace_user:workspace_dev_password@localhost:5432/workspace_dev" -f infra/docker/postgres/init.sql

      # The trailing "..." also builds @workspace/core and @workspace/prompts: db's tsc reads their types from dist.
      - name: Build Database Package
        run: pnpm --filter "@workspace/db..." build

      - name: Apply Database Migrations
        env:
          DATABASE_MIGRATION_URL: postgresql://workspace_user:workspace_dev_password@localhost:5432/workspace_dev
        run: pnpm --filter @workspace/db migrate

      # No DATABASE_* variables: several suites read DATABASE_DIRECT_URL as the owner URL and default to this service.
      - name: Run Unit & Contract Tests
        run: pnpm run test

      - name: Build All Workspaces
        run: pnpm run build

      # Workspace packages resolve each other's types from dist, so typechecking needs the build above.
      - name: Strict TypeScript Compilation
        run: pnpm run typecheck
